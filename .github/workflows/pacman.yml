name: Generate Snake (Apple theme)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/apple-contribution-graph.svg?palette=github-dark&color_snake=%230A84FF&color_dots=%23FFFFFF,%23FEBC2E,%2328C840,%230A84FF
            dist/apple-contribution-graph-light.svg?palette=github-light&color_snake=%23007AFF&color_dots=%23E5E5EA,%23FFD60A,%2330D158,%23007AFF

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
